; Vancouver SkyTrain PCB v3 firmware
; The board has a bare XIAO footprint (U1, DNP) on the back, so any
; XIAO-family module fits. Pin *names* (D0..D10) are the same across the
; family and map to the same physical pads, so one source builds for all;
; only the environment changes.

[platformio]
default_envs = xiao_esp32c3

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
	fastled/FastLED@^3.5.0

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
; Serial goes to the native USB CDC, not UART0. This matters on this board:
; the LED data pin D7 is GPIO20, which is also UART0 RX - if Serial were on
; UART0 it would fight the LED output.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_rp2040]
; community RP2040 platform (earlephilhower Arduino core) - the official
; PlatformIO 'raspberrypi' platform (mbed) has no XIAO RP2040 board def
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
board_build.core = earlephilhower
