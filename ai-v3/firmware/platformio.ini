; Vancouver SkyTrain PCB v3 firmware
; Target: Seeed Studio XIAO RP2040 (DNP footprint on the back of the board)

[env]
monitor_speed = 115200

[env:xiao_rp2040]
; community RP2040 platform (earlephilhower Arduino core) - the official
; PlatformIO 'raspberrypi' platform (mbed) has no XIAO RP2040 board def
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
framework = arduino
board_build.core = earlephilhower
lib_ldf_mode = deep+
lib_deps =
	fastled/FastLED@^3.5.0
